name: QC CPU Probe (temp)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Cài đặt Kaggle CLI
        run: pip install -q --upgrade kaggle

      - name: Push kernel CPU tối giản và kiểm tra queue
        env:
          S_USER: ${{ secrets.SYNTHESIS_KAGGLE_USER }}
          S_KEY: ${{ secrets.SYNTHESIS_KAGGLE_KEY }}
        run: |
          python3 - << 'PY'
          import json, os, subprocess, time, sys

          user = (os.environ.get("S_USER") or "").strip()
          key = (os.environ.get("S_KEY") or "").strip()
          os.makedirs(os.path.expanduser("~/.kaggle"), exist_ok=True)
          p = os.path.expanduser("~/.kaggle/access_token")
          with open(p, "w") as f:
              f.write(key)
          os.chmod(p, 0o600)
          env = {**os.environ, "KAGGLE_API_TOKEN": key}

          d = "/tmp/cpu_probe"
          os.makedirs(d, exist_ok=True)
          with open(f"{d}/script.py", "w") as f:
              f.write("import time\nprint('hello from cpu kernel')\ntime.sleep(5)\n")
          meta = {
              "id": f"{user}/dubbing-cpu-probe",
              "title": "dubbing-cpu-probe",
              "code_file": "script.py",
              "language": "python",
              "kernel_type": "script",
              "is_private": True,
              "enable_gpu": False,
              "enable_internet": False,
              "dataset_sources": [],
              "competition_sources": [],
              "kernel_sources": [],
          }
          with open(f"{d}/kernel-metadata.json", "w") as f:
              json.dump(meta, f)

          from kaggle.api.kaggle_api_extended import KaggleApi
          api = KaggleApi()
          api.authenticate()
          slug = f"{user}/dubbing-cpu-probe"

          r = subprocess.run(["kaggle", "kernels", "push", "-p", d], env=env, capture_output=True, text=True)
          print("[push]", r.returncode, (r.stdout or "").strip(), (r.stderr or "").strip(), flush=True)

          for i in range(8):
              time.sleep(20)
              try:
                  print(f"[{i}] status={api.kernels_status(slug).status.name}", flush=True)
              except Exception as e:
                  print(f"[{i}] err {e}", flush=True)
          PY
