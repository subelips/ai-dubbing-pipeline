name: QC Kernel Logs (temp)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cài đặt Kaggle CLI
        run: pip install -q --upgrade kaggle

      - name: In log kernel perception-qc2
        env:
          P_USER: ${{ secrets.PERCEPTION_KAGGLE_USER }}
          P_KEY: ${{ secrets.PERCEPTION_KAGGLE_KEY }}
        run: |
          python3 - << 'PY'
          import os, subprocess
          key = (os.environ.get("P_KEY") or "").strip()
          user = (os.environ.get("P_USER") or "").strip()
          os.makedirs(os.path.expanduser("~/.kaggle"), exist_ok=True)
          p = os.path.expanduser("~/.kaggle/access_token")
          open(p, "w").write(key)
          os.chmod(p, 0o600)
          env = {**os.environ, "KAGGLE_API_TOKEN": key}
          r = subprocess.run(["kaggle", "kernels", "logs", f"{user}/dubbing-perception-qc2"], env=env, capture_output=True, text=True)
          out = (r.stdout or "") + "\n" + (r.stderr or "")
          print(out[-20000:])
          PY
