name: QC Kaggle Diag (temp)

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job ID"
        required: true
        default: "qc1"

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Probe Kaggle internal API (GetKernel raw)
        env:
          P_USER: ${{ secrets.PERCEPTION_KAGGLE_USER }}
          P_KEY: ${{ secrets.PERCEPTION_KAGGLE_KEY }}
        run: |
          python3 - << 'PY'
          import json, os
          import requests

          user = (os.environ.get("P_USER") or "").strip()
          key = (os.environ.get("P_KEY") or "").strip()
          s = requests.Session()
          s.headers.update({
              "Authorization": f"Bearer {key}",
              "Content-Type": "application/json",
              "Accept": "application/json",
              "User-Agent": "kaggle-api/v2.2.5",
          })
          api = "https://api.kaggle.com/v1/kernels.KernelsApiService"

          def call(method, body):
              r = s.post(f"{api}/{method}", json=body, timeout=30)
              print(f"--- {method}: http {r.status_code}")
              print(r.text[:6000])
              print()

          call("GetKernel", {"userName": user, "kernelSlug": "dubbing-perception"})
          call("GetKernelSessionStatus", {"userName": user, "kernelSlug": "dubbing-perception"})
          call("ListKernelSessionOutput", {"userName": user, "kernelSlug": "dubbing-perception", "pageSize": 5})
          PY
