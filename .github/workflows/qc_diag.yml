name: QC Kaggle Diag (temp)

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job ID"
        required: true
        default: "qc1"

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: GetKernel qua web RPC (kernels.KernelsService)
        env:
          P_USER: ${{ secrets.PERCEPTION_KAGGLE_USER }}
          P_KEY: ${{ secrets.PERCEPTION_KAGGLE_KEY }}
        run: |
          python3 - << 'PY'
          import json, os
          import requests

          user = (os.environ.get("P_USER") or "").strip()
          key = (os.environ.get("P_KEY") or "").strip()
          s = requests.Session()
          s.headers.update({
              "Authorization": f"Bearer {key}",
              "Content-Type": "application/json",
              "Accept": "application/json",
              "User-Agent": "Mozilla/5.0 kaggle-api/v2.2.5",
          })
          url = "https://www.kaggle.com/api/i/kernels.KernelsService/GetKernel"
          r = s.post(url, json={"userName": user, "kernelSlug": "dubbing-perception"}, timeout=30)
          print("http", r.status_code)
          try:
              data = r.json()
              print(json.dumps(data, ensure_ascii=False)[:8000])
          except Exception:
              print(r.text[:3000])
          PY
