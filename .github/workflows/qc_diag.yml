name: QC Kaggle Diag (temp)

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job ID"
        required: true
        default: "qc1"

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trạng thái các kernel perception
        env:
          P_USER: ${{ secrets.PERCEPTION_KAGGLE_USER }}
          P_KEY: ${{ secrets.PERCEPTION_KAGGLE_KEY }}
        run: |
          python3 - << 'PY'
          import os
          import requests

          user = (os.environ.get("P_USER") or "").strip()
          key = (os.environ.get("P_KEY") or "").strip()
          s = requests.Session()
          s.headers.update({"Authorization": f"Bearer {key}", "Accept": "application/json"})
          for slug in ("dubbing-perception", "dubbing-perception-qc2"):
              r = s.get("https://www.kaggle.com/api/v1/kernels/status",
                        params={"userName": user, "kernelSlug": slug}, timeout=30)
              print(slug, "->", r.status_code, r.text[:300], flush=True)
          PY
