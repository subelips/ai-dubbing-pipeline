name: AI Video Dubbing Pipeline

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job ID cần chạy"
        required: true
        default: "ep01"
      video_asset:
        description: "Link video (.mp4 / Google Drive) hoặc tên file asset"
        required: false
        default: ""
      stage:
        description: "Giai đoạn chạy (stage1 | stage2 | stage3)"
        required: false
        default: "stage1"
  repository_dispatch:
    types: [stage1_completed, stage2_completed]

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}
  GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN || github.token }}
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
  NTFY_SERVER: ${{ secrets.NTFY_SERVER || 'https://ntfy.sh' }}
  NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  run-pipeline-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Xác định Job ID, Stage & cập nhật state/jobs.json
        id: ctx
        env:
          INPUT_JOB_ID: ${{ github.event.inputs.job_id || github.event.client_payload.job_id || 'ep01' }}
          INPUT_VIDEO_ASSET: ${{ github.event.inputs.video_asset || github.event.client_payload.video_asset || '' }}
          INPUT_STAGE: ${{ github.event.inputs.stage || '' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action || '' }}
        run: |
          python3 - << 'PY'
          import base64, json, os, requests

          repo = os.environ["GH_REPO"]
          token = os.environ["GH_PAT_TOKEN"]
          job_id = os.environ["INPUT_JOB_ID"].strip()
          video_asset = os.environ["INPUT_VIDEO_ASSET"].strip()
          event_name = os.environ["EVENT_NAME"]
          action = os.environ["EVENT_ACTION"]
          raw_stage = os.environ["INPUT_STAGE"].strip().lower()

          if event_name == "repository_dispatch":
              if action == "stage1_completed":
                  target_stage = "stage2"
              elif action == "stage2_completed":
                  target_stage = "stage3"
              else:
                  target_stage = "stage1"
          else:
              target_stage = raw_stage if raw_stage in ("stage1", "stage2", "stage3") else "stage1"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"job_id={job_id}\n")
              out.write(f"stage={target_stage}\n")

          # Đảm bảo nhánh pipeline-state và file state/jobs.json tồn tại
          api = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          # Kiểm tra nhánh pipeline-state, tạo nếu chưa có
          br = requests.get(f"{api}/git/ref/heads/pipeline-state", headers=headers, timeout=20)
          if br.status_code == 404:
              main_ref = requests.get(f"{api}/git/ref/heads/main", headers=headers, timeout=20)
              if main_ref.status_code != 200:
                  main_ref = requests.get(f"{api}/git/ref/heads/master", headers=headers, timeout=20)
              sha = main_ref.json()["object"]["sha"]
              requests.post(
                  f"{api}/git/refs",
                  headers=headers,
                  json={"ref": "refs/heads/pipeline-state", "sha": sha},
                  timeout=20,
              ).raise_for_status()

          # Đọc hoặc khởi tạo state/jobs.json
          jobs_url = f"{api}/contents/state/jobs.json"
          r = requests.get(jobs_url, headers=headers, params={"ref": "pipeline-state"}, timeout=20)
          file_sha = None
          if r.status_code == 200:
              info = r.json()
              file_sha = info["sha"]
              raw_txt = base64.b64decode(info["content"]).decode("utf-8").strip()
              data = json.loads(raw_txt) if raw_txt else {"jobs": {}}
          else:
              data = {"jobs": {}}

          jobs = data.setdefault("jobs", {})
          job_entry = jobs.setdefault(job_id, {})
          if video_asset:
              job_entry["video_asset"] = video_asset
          elif "video_asset" not in job_entry:
              job_entry["video_asset"] = "source_input.mp4"

          if target_stage == "stage1":
              job_entry["status"] = "STAGE1_RUNNING"
          elif target_stage == "stage2":
              job_entry["status"] = "STAGE2_RUNNING"
          elif target_stage == "stage3":
              job_entry["status"] = "STAGE3_RUNNING"

          body = {
              "message": f"init/update job {job_id} ({target_stage})",
              "content": base64.b64encode(json.dumps(data, ensure_ascii=False, indent=2).encode("utf-8")).decode("utf-8"),
              "branch": "pipeline-state",
          }
          if file_sha:
              body["sha"] = file_sha
          requests.put(jobs_url, headers=headers, json=body, timeout=20).raise_for_status()
          print(f"[INFO] Đã sẵn sàng job={job_id}, stage={target_stage}")
          PY

      - name: Cài đặt Kaggle CLI
        run: pip install -q kaggle

      - name: Chuẩn bị script & đẩy Kernel lên Kaggle
        env:
          JOB_ID: ${{ steps.ctx.outputs.job_id }}
          STAGE: ${{ steps.ctx.outputs.stage }}
          PERCEPTION_KAGGLE_USER: ${{ secrets.PERCEPTION_KAGGLE_USER || secrets.KAGGLE_USERNAME }}
          PERCEPTION_KAGGLE_KEY: ${{ secrets.PERCEPTION_KAGGLE_KEY || secrets.KAGGLE_KEY }}
          TRANSLATION_KAGGLE_USER: ${{ secrets.TRANSLATION_KAGGLE_USER || secrets.KAGGLE_USERNAME }}
          TRANSLATION_KAGGLE_KEY: ${{ secrets.TRANSLATION_KAGGLE_KEY || secrets.KAGGLE_KEY }}
          SYNTHESIS_KAGGLE_USER: ${{ secrets.SYNTHESIS_KAGGLE_USER || secrets.KAGGLE_USERNAME }}
          SYNTHESIS_KAGGLE_KEY: ${{ secrets.SYNTHESIS_KAGGLE_KEY || secrets.KAGGLE_KEY }}
        run: |
          python3 - << 'PY'
          import json, os, shutil, subprocess

          stage = os.environ["STAGE"]
          job_id = os.environ["JOB_ID"]

          stage_map = {
              "stage1": ("01_perception/run_perception.py", "dubbing-stage1-perception", "PERCEPTION_KAGGLE_USER", "PERCEPTION_KAGGLE_KEY"),
              "stage2": ("02_translation/run_translation.py", "dubbing-stage2-translation", "TRANSLATION_KAGGLE_USER", "TRANSLATION_KAGGLE_KEY"),
              "stage3": ("03_synthesis/run_synthesis.py", "dubbing-stage3-synthesis", "SYNTHESIS_KAGGLE_USER", "SYNTHESIS_KAGGLE_KEY"),
          }
          src_file, slug_suffix, u_key, k_key = stage_map[stage]
          k_user = os.environ.get(u_key, "").strip()
          k_secret = os.environ.get(k_key, "").strip()
          if not k_user or not k_secret:
              raise RuntimeError(f"Thiếu secret Kaggle cho {stage} ({u_key} / {k_key}).")

          os.makedirs(os.path.expanduser("~/.kaggle"), exist_ok=True)
          cred_path = os.path.expanduser("~/.kaggle/kaggle.json")
          with open(cred_path, "w", encoding="utf-8") as f:
              json.dump({"username": k_user, "key": k_secret}, f)
          os.chmod(cred_path, 0o600)

          with open(src_file, "r", encoding="utf-8") as f:
              code = f.read()

          replacements = {
              "__INJECT_JOB_ID__": job_id,
              "__INJECT_GH_REPO__": os.environ.get("GH_REPO", ""),
              "__INJECT_GH_PAT_TOKEN__": os.environ.get("GH_PAT_TOKEN", ""),
              "__INJECT_NTFY_TOPIC__": os.environ.get("NTFY_TOPIC", ""),
              "__INJECT_NTFY_SERVER__": os.environ.get("NTFY_SERVER", "https://ntfy.sh"),
              "__INJECT_NTFY_TOKEN__": os.environ.get("NTFY_TOKEN", ""),
          }
          for k, v in replacements.items():
              code = code.replace(k, v)

          # Truyền HF_TOKEN vào đầu script để pyannote.audio & Hugging Face dùng trực tiếp
          hf_tok = os.environ.get("HF_TOKEN", "").strip()
          if hf_tok:
              code = f'import os\nos.environ["HF_TOKEN"] = {json.dumps(hf_tok)}\n' + code

          build_dir = f"/tmp/kaggle_{stage}"
          if os.path.exists(build_dir):
              shutil.rmtree(build_dir)
          os.makedirs(build_dir, exist_ok=True)

          out_script = os.path.join(build_dir, "script.py")
          with open(out_script, "w", encoding="utf-8") as f:
              f.write(code)

          meta = {
              "id": f"{k_user}/{slug_suffix}",
              "title": slug_suffix,
              "code_file": "script.py",
              "language": "python",
              "kernel_type": "script",
              "is_private": True,
              "enable_gpu": True,
              "enable_internet": True,
              "dataset_sources": [],
              "competition_sources": [],
              "kernel_sources": [],
          }
          with open(os.path.join(build_dir, "kernel-metadata.json"), "w", encoding="utf-8") as f:
              json.dump(meta, f, indent=2)

          subprocess.run(["kaggle", "kernels", "push", "-p", build_dir], check=True)
          print(f"[INFO] Đã đẩy kernel {k_user}/{slug_suffix} cho job {job_id}")
          PY

      - name: Gửi thông báo kích hoạt Kaggle qua ntfy
        if: always()
        env:
          JOB_ID: ${{ steps.ctx.outputs.job_id }}
          STAGE: ${{ steps.ctx.outputs.stage }}
          STEP_STATUS: ${{ job.status }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            exit 0
          fi
          MSG="Job: ${JOB_ID} | Stage: ${STAGE} | Workflow status: ${STEP_STATUS}"
          AUTH_HEADER=()
          if [ -n "$NTFY_TOKEN" ]; then
            AUTH_HEADER=(-H "Authorization: Bearer ${NTFY_TOKEN}")
          fi
          curl -fsSL -X POST "${NTFY_SERVER%/}/${NTFY_TOPIC}" \
            -H "Title: Kaggle Push (${STAGE}) - ${JOB_ID}" \
            -H "Tags: rocket" \
            "${AUTH_HEADER[@]}" \
            --data-binary "$MSG" || true
