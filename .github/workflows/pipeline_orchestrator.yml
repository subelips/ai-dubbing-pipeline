name: Video Dubbing Pipeline Orchestrator

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Mã định danh job (vd: ep01)"
        required: true
        type: string
      video_asset:
        description: "Tên file video trong Release của job (mặc định: source_input.mp4)"
        required: false
        default: "source_input.mp4"
        type: string
  repository_dispatch:
    types: [stage1_completed, stage2_completed]

jobs:
  run_stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine active stage & job payload
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ASSET="${{ inputs.video_asset }}"
            if [ -z "$ASSET" ]; then ASSET="source_input.mp4"; fi
            echo "stage=perception" >> $GITHUB_OUTPUT
            echo "job_id=${{ inputs.job_id }}" >> $GITHUB_OUTPUT
            echo "video_asset=$ASSET" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.action }}" = "stage1_completed" ]; then
            echo "stage=translation" >> $GITHUB_OUTPUT
            echo "job_id=${{ github.event.client_payload.job_id }}" >> $GITHUB_OUTPUT
            echo "video_asset=" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.action }}" = "stage2_completed" ]; then
            echo "stage=synthesis" >> $GITHUB_OUTPUT
            echo "job_id=${{ github.event.client_payload.job_id }}" >> $GITHUB_OUTPUT
            echo "video_asset=" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python & Kaggle CLI
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies into target Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --upgrade six requests kaggle

          KAGGLE_BIN="$(command -v kaggle || true)"
          if [ -n "$KAGGLE_BIN" ] && [ -f "$KAGGLE_BIN" ]; then
            SHEBANG_PY="$(head -n 1 "$KAGGLE_BIN" | sed 's/^#!//')"
            if [ -n "$SHEBANG_PY" ] && [ -x "$SHEBANG_PY" ]; then
              "$SHEBANG_PY" -m pip install --no-cache-dir --upgrade six requests kaggle
            fi
          fi

      - name: Register initial job in pipeline-state branch (Stage 1 only)
        if: steps.meta.outputs.stage == 'perception'
        env:
          GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          JOB_ID: ${{ steps.meta.outputs.job_id }}
          VIDEO_ASSET: ${{ steps.meta.outputs.video_asset }}
        run: |
          python - <<'EOF'
          import base64
          import json
          import os
          import time
          import requests

          repo = os.environ["GH_REPO"]
          token = os.environ["GH_PAT_TOKEN"]
          job_id = os.environ["JOB_ID"]
          video_asset = os.environ["VIDEO_ASSET"] or "source_input.mp4"
          branch = "pipeline-state"
          path = "state/jobs.json"
          url = f"https://api.github.com/repos/{repo}/contents/{path}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          for attempt in range(5):
              r = requests.get(url, headers=headers, params={"ref": branch}, timeout=30)
              if r.status_code == 404:
                  data, sha = {"jobs": {}}, None
              else:
                  r.raise_for_status()
                  resp = r.json()
                  raw = base64.b64decode(resp["content"]).decode("utf-8").strip()
                  data = json.loads(raw) if raw else {"jobs": {}}
                  sha = resp["sha"]

              data.setdefault("jobs", {})[job_id] = {
                  "video_asset": video_asset,
                  "status": "QUEUED_STAGE1",
              }
              payload = {
                  "message": f"queue job {job_id}",
                  "content": base64.b64encode(
                      json.dumps(data, ensure_ascii=False, indent=2).encode("utf-8")
                  ).decode("utf-8"),
                  "branch": branch,
              }
              if sha:
                  payload["sha"] = sha

              put_r = requests.put(url, headers=headers, json=payload, timeout=30)
              if put_r.status_code in (200, 201):
                  break
              if put_r.status_code == 409:
                  time.sleep(1.5 * (attempt + 1))
                  continue
              put_r.raise_for_status()
          EOF

      - name: Push Stage 1 Kernel (Perception)
        if: steps.meta.outputs.stage == 'perception'
        env:
          KAGGLE_USERNAME: ${{ secrets.PERCEPTION_KAGGLE_USER }}
          KAGGLE_KEY: ${{ secrets.PERCEPTION_KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.PERCEPTION_KAGGLE_KEY }}
          JOB_ID: ${{ steps.meta.outputs.job_id }}
          GH_REPO: ${{ github.repository }}
          GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p ~/.kaggle
          printf "%s" "$KAGGLE_API_TOKEN" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
          python - <<'EOF'
          import os
          p = "01_perception/run_perception.py"
          with open(p, "r", encoding="utf-8") as f:
              code = f.read()
          replacements = {
              "__INJECT_JOB_ID__": os.environ["JOB_ID"],
              "__INJECT_GH_REPO__": os.environ["GH_REPO"],
              "__INJECT_GH_PAT_TOKEN__": os.environ["GH_PAT_TOKEN"],
              "__INJECT_TELEGRAM_BOT_TOKEN__": os.environ.get("TELEGRAM_BOT_TOKEN", ""),
              "__INJECT_TELEGRAM_CHAT_ID__": os.environ.get("TELEGRAM_CHAT_ID", ""),
          }
          for k, v in replacements.items():
              code = code.replace(k, v)
          with open(p, "w", encoding="utf-8") as f:
              f.write(code)
          EOF
          kaggle kernels push -p 01_perception
          git checkout -- 01_perception/run_perception.py

      - name: Push Stage 2 Kernel (Translation)
        if: steps.meta.outputs.stage == 'translation'
        env:
          KAGGLE_USERNAME: ${{ secrets.TRANSLATION_KAGGLE_USER }}
          KAGGLE_KEY: ${{ secrets.TRANSLATION_KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.TRANSLATION_KAGGLE_KEY }}
          JOB_ID: ${{ steps.meta.outputs.job_id }}
          GH_REPO: ${{ github.repository }}
          GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p ~/.kaggle
          printf "%s" "$KAGGLE_API_TOKEN" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
          python - <<'EOF'
          import os
          p = "02_translation/run_translation.py"
          with open(p, "r", encoding="utf-8") as f:
              code = f.read()
          replacements = {
              "__INJECT_JOB_ID__": os.environ["JOB_ID"],
              "__INJECT_GH_REPO__": os.environ["GH_REPO"],
              "__INJECT_GH_PAT_TOKEN__": os.environ["GH_PAT_TOKEN"],
              "__INJECT_TELEGRAM_BOT_TOKEN__": os.environ.get("TELEGRAM_BOT_TOKEN", ""),
              "__INJECT_TELEGRAM_CHAT_ID__": os.environ.get("TELEGRAM_CHAT_ID", ""),
          }
          for k, v in replacements.items():
              code = code.replace(k, v)
          with open(p, "w", encoding="utf-8") as f:
              f.write(code)
          EOF
          kaggle kernels push -p 02_translation
          git checkout -- 02_translation/run_translation.py

      - name: Push Stage 3 Kernel (Synthesis)
        if: steps.meta.outputs.stage == 'synthesis'
        env:
          KAGGLE_USERNAME: ${{ secrets.SYNTHESIS_KAGGLE_USER }}
          KAGGLE_KEY: ${{ secrets.SYNTHESIS_KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.SYNTHESIS_KAGGLE_KEY }}
          JOB_ID: ${{ steps.meta.outputs.job_id }}
          GH_REPO: ${{ github.repository }}
          GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p ~/.kaggle
          printf "%s" "$KAGGLE_API_TOKEN" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
          python - <<'EOF'
          import os
          p = "03_synthesis/run_synthesis.py"
          with open(p, "r", encoding="utf-8") as f:
              code = f.read()
          replacements = {
              "__INJECT_JOB_ID__": os.environ["JOB_ID"],
              "__INJECT_GH_REPO__": os.environ["GH_REPO"],
              "__INJECT_GH_PAT_TOKEN__": os.environ["GH_PAT_TOKEN"],
              "__INJECT_TELEGRAM_BOT_TOKEN__": os.environ.get("TELEGRAM_BOT_TOKEN", ""),
              "__INJECT_TELEGRAM_CHAT_ID__": os.environ.get("TELEGRAM_CHAT_ID", ""),
          }
          for k, v in replacements.items():
              code = code.replace(k, v)
          with open(p, "w", encoding="utf-8") as f:
              f.write(code)
          EOF
          kaggle kernels push -p 03_synthesis
          git checkout -- 03_synthesis/run_synthesis.py
