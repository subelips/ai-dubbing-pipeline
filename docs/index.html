<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Dubbing Pipeline Control</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --ok: #22c55e;
      --warn: #f59e0b;
      --err: #ef4444;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 16px; }
    .container { max-width: 780px; margin: 0 auto; }
    h1 { font-size: 1.35rem; margin: 0 0 6px; }
    .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 18px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .card h2 { font-size: 1rem; margin: 0 0 12px; color: var(--accent); }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
    input[type="text"], input[type="password"], input[type="file"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0b1220;
      color: var(--text);
      font-size: 0.95rem;
      margin-bottom: 12px;
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      background: var(--accent);
      color: #06121e;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button:hover:not(:disabled) { background: var(--accent-hover); color: #fff; }
    button.secondary { background: #334155; color: var(--text); }
    button.danger { background: #7f1d1d; color: #fecaca; }
    .msg {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      background: #0b1220;
      border: 1px solid var(--border);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .job-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      background: #0b1220;
    }
    .job-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .badge {
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      background: #334155;
      color: #f8fafc;
    }
    .badge.done { background: rgba(34, 197, 94, 0.2); color: var(--ok); }
    .badge.run { background: rgba(56, 189, 248, 0.2); color: var(--accent); }
    .badge.wait { background: rgba(245, 158, 11, 0.2); color: var(--warn); }
    .small { font-size: 0.82rem; color: var(--muted); margin-top: 6px; word-break: break-all; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 Video Dubbing Pipeline</h1>
    <div class="subtitle">Tải video trực tiếp lên GitHub Release &amp; điều khiển pipeline 3 giai đoạn</div>

    <div class="card">
      <h2>1. Kết nối Repository</h2>
      <label for="repoInput">Repository (owner/repo)</label>
      <input id="repoInput" type="text" placeholder="vd: subelips/ai-dubbing-studio" />

      <label for="tokenInput">GitHub Personal Access Token (lưu trên trình duyệt thiết bị này)</label>
      <input id="tokenInput" type="password" placeholder="ghp_..." />

      <div class="row">
        <button onclick="saveConfig()">Lưu cấu hình</button>
        <button class="secondary" onclick="loadJobs()">Tải danh sách Job</button>
        <button class="danger" onclick="clearToken()">Xóa Token</button>
      </div>
      <div id="cfgMsg" class="msg" style="display:none;"></div>
    </div>

    <div class="card">
      <h2>2. Tải video lên &amp; Khởi chạy Job (Stage 1)</h2>
      <label for="jobIdInput">Job ID</label>
      <input id="jobIdInput" type="text" placeholder="vd: ep02" />

      <label for="videoFileInput">Chọn file video (.mp4 / .mkv / .mov)</label>
      <input id="videoFileInput" type="file" accept="video/*" />

      <div class="row">
        <button id="uploadStartBtn" onclick="uploadAndStartJob()">⬆️ Tải video &amp; Chạy Stage 1</button>
        <button class="secondary" onclick="dispatchStage('stage1_completed')">⏩ Trigger Stage 2</button>
        <button class="secondary" onclick="dispatchStage('stage2_completed')">🎙️ Trigger Stage 3</button>
      </div>
      <div id="actionMsg" class="msg" style="display:none;"></div>
    </div>

    <div class="card">
      <h2>3. Trạng thái các Job</h2>
      <div id="jobsList"><div class="small">Bấm "Tải danh sách Job" để xem dữ liệu từ nhánh pipeline-state.</div></div>
    </div>
  </div>

  <script>
    const WORKFLOW_FILE = "pipeline_orchestrator.yml";
    const STATE_BRANCH = "pipeline-state";

    function showBox(id, text, isErr = false) {
      const el = document.getElementById(id);
      el.style.display = "block";
      el.style.borderColor = isErr ? "#ef4444" : "#38bdf8";
      el.textContent = text;
    }

    function getConfig() {
      const repo = document.getElementById("repoInput").value.trim() || localStorage.getItem("dub_repo") || "";
      const token = document.getElementById("tokenInput").value.trim() || localStorage.getItem("dub_token") || "";
      return { repo, token };
    }

    function saveConfig() {
      const repo = document.getElementById("repoInput").value.trim();
      const token = document.getElementById("tokenInput").value.trim();
      if (!repo || !token) {
        showBox("cfgMsg", "Vui lòng nhập đầy đủ Repository (owner/repo) và GitHub Token.", true);
        return;
      }
      localStorage.setItem("dub_repo", repo);
      localStorage.setItem("dub_token", token);
      showBox("cfgMsg", "Đã lưu cấu hình trên trình duyệt này.");
      loadJobs();
    }

    function clearToken() {
      localStorage.removeItem("dub_token");
      document.getElementById("tokenInput").value = "";
      showBox("cfgMsg", "Đã xóa GitHub Token khỏi trình duyệt.");
    }

    function ghHeaders(token, extra = {}) {
      return {
        "Authorization": `Bearer ${token}`,
        "Accept": "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28",
        ...extra
      };
    }

    function xhrUpload(url, token, buffer, onProgress) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open("POST", url, true);
        xhr.setRequestHeader("Authorization", `Bearer ${token}`);
        xhr.setRequestHeader("Accept", "application/vnd.github+json");
        xhr.setRequestHeader("Content-Type", "application/octet-stream");
        xhr.timeout = 300000;

        if (xhr.upload && onProgress) {
          xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) {
              onProgress(Math.round((e.loaded / e.total) * 100));
            }
          };
        }

        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            resolve(xhr.responseText);
          } else {
            reject(new Error(`HTTP ${xhr.status}: ${xhr.responseText}`));
          }
        };
        xhr.onerror = () => reject(new Error(`XHR network error tới ${url}`));
        xhr.ontimeout = () => reject(new Error("XHR timeout khi upload"));
        xhr.send(buffer);
      });
    }

    async function ensureRelease(repo, token, tag) {
      const checkRes = await fetch(`https://api.github.com/repos/${repo}/releases/tags/${encodeURIComponent(tag)}`, {
        headers: ghHeaders(token)
      });
      if (checkRes.status === 200) return await checkRes.json();

      const createRes = await fetch(`https://api.github.com/repos/${repo}/releases`, {
        method: "POST",
        headers: ghHeaders(token, { "Content-Type": "application/json" }),
        body: JSON.stringify({
          tag_name: tag,
          name: `Media - ${tag}`,
          draft: false,
          prerelease: false
        })
      });
      if (!createRes.ok) throw new Error(`Tạo Release thất bại (${createRes.status}): ${await createRes.text()}`);
      return await createRes.json();
    }

    async function uploadVideoToRelease(repo, token, tag, file) {
      showBox("actionMsg", `1/3 Đang kiểm tra/tạo Release "${tag}"...`);
      const release = await ensureRelease(repo, token, tag);
      const assetName = "source_input.mp4";

      for (const asset of (release.assets || [])) {
        if (asset.name === assetName) {
          await fetch(`https://api.github.com/repos/${repo}/releases/assets/${asset.id}`, {
            method: "DELETE",
            headers: ghHeaders(token)
          });
        }
      }

      const buffer = await file.arrayBuffer();
      const uploadUrlBase = release.upload_url.split("{")[0];
      const fullUploadUrl = `${uploadUrlBase}?name=${encodeURIComponent(assetName)}`;

      await xhrUpload(fullUploadUrl, token, buffer, (pct) => {
        showBox("actionMsg", `2/3 Đang tải "${assetName}" (${(file.size / 1048576).toFixed(1)} MB): ${pct}%...`);
      });

      return assetName;
    }

    async function uploadAndStartJob() {
      const { repo, token } = getConfig();
      const jobId = document.getElementById("jobIdInput").value.trim();
      const fileInput = document.getElementById("videoFileInput");
      const file = fileInput.files && fileInput.files[0];

      if (!repo || !token) return showBox("actionMsg", "Thiếu Repository hoặc Token.", true);
      if (!jobId) return showBox("actionMsg", "Vui lòng nhập Job ID.", true);
      if (!file) return showBox("actionMsg", "Vui lòng chọn file video trước khi tải lên.", true);

      const btn = document.getElementById("uploadStartBtn");
      btn.disabled = true;
      try {
        const uploadedAsset = await uploadVideoToRelease(repo, token, jobId, file);

        showBox("actionMsg", `3/3 Đã tải xong "${uploadedAsset}". Đang kích hoạt workflow Stage 1...`);
        const wfRes = await fetch(
          `https://api.github.com/repos/${repo}/actions/workflows/${WORKFLOW_FILE}/dispatches`,
          {
            method: "POST",
            headers: ghHeaders(token, { "Content-Type": "application/json" }),
            body: JSON.stringify({
              ref: "main",
              inputs: { job_id: jobId, video_asset: uploadedAsset }
            })
          }
        );
        if (!wfRes.ok) throw new Error(`Kích hoạt workflow thất bại (${wfRes.status}): ${await wfRes.text()}`);

        showBox("actionMsg", `✅ Đã khởi chạy job "${jobId}" với file "${uploadedAsset}" (Stage 1).`);
        setTimeout(loadJobs, 2000);
      } catch (err) {
        showBox("actionMsg", `❌ Lỗi: ${err.message}`, true);
      } finally {
        btn.disabled = false;
      }
    }

    async function dispatchStage(eventType) {
      const { repo, token } = getConfig();
      const jobId = document.getElementById("jobIdInput").value.trim();
      if (!repo || !token) return showBox("actionMsg", "Thiếu Repository hoặc Token.", true);
      if (!jobId) return showBox("actionMsg", "Vui lòng nhập Job ID cần kích hoạt stage.", true);

      try {
        const res = await fetch(
          `https://api.github.com/repos/${repo}/dispatches`,
          {
            method: "POST",
            headers: ghHeaders(token, { "Content-Type": "application/json" }),
            body: JSON.stringify({
              event_type: eventType,
              client_payload: { job_id: jobId }
            })
          }
        );
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
        showBox("actionMsg", `✅ Đã gửi sự kiện "${eventType}" cho job "${jobId}".`);
      } catch (err) {
        showBox("actionMsg", `❌ Lỗi gửi dispatch:\n${err.message}`, true);
      }
    }

    function badgeClass(status = "") {
      if (status === "COMPLETED") return "badge done";
      if (status.includes("DONE") || status.includes("QUEUED")) return "badge wait";
      return "badge run";
    }

    async function loadJobs() {
      const { repo, token } = getConfig();
      const listEl = document.getElementById("jobsList");
      if (!repo || !token) {
        listEl.innerHTML = `<div class="small">Vui lòng nhập Repository và Token ở mục 1 trước.</div>`;
        return;
      }
      listEl.innerHTML = `<div class="small">Đang tải dữ liệu...</div>`;

      try {
        const res = await fetch(
          `https://api.github.com/repos/${repo}/contents/state/jobs.json?ref=${STATE_BRANCH}`,
          { headers: ghHeaders(token) }
        );
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
        const fileData = await res.json();
        const decoded = decodeURIComponent(escape(atob(fileData.content.replace(/\n/g, ""))));
        const parsed = JSON.parse(decoded || '{"jobs":{}}');
        const jobs = parsed.jobs || {};
        const entries = Object.entries(jobs).reverse();

        if (entries.length === 0) {
          listEl.innerHTML = `<div class="small">Chưa có job nào trong state/jobs.json.</div>`;
          return;
        }

        listEl.innerHTML = entries.map(([id, info]) => `
          <div class="job-item">
            <div class="job-top">
              <strong><code>${id}</code></strong>
              <span class="${badgeClass(info.status)}">${info.status || "UNKNOWN"}</span>
            </div>
            <div class="small">Video asset: ${info.video_asset || info.video_url || ""}</div>
            ${info.output_url ? `<div class="small">Thành phẩm: <a href="${info.output_url}" target="_blank">Tải MP4</a></div>` : ""}
          </div>
        `).join("");
      } catch (err) {
        listEl.innerHTML = `<div class="small" style="color:#fca5a5;">Lỗi tải jobs: ${err.message}</div>`;
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      const savedRepo = localStorage.getItem("dub_repo") || "";
      const savedToken = localStorage.getItem("dub_token") || "";
      if (savedRepo) document.getElementById("repoInput").value = savedRepo;
      if (savedToken) document.getElementById("tokenInput").value = savedToken;
      if (savedRepo && savedToken) loadJobs();
    });
  </script>
</body>
</html>
